name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: low

  pr-validator:
    name: Run Pull Request Checks
    needs: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Oracle Instant Client
        id: oracle
        run: ./.github/scripts/oracle-instant-client.sh

      - name: Free up disk space (before)
        run: ./.github/scripts/free-disk-space.sh

      - name: Login to oracle container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: container-registry.oracle.com
          username: ${{ secrets.ORACLE_USERNAME }}
          password: ${{ secrets.ORACLE_SECRET_KEY }}

      - name: Security audit
        run: npm run security-audit

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - name: Start only oracledb compose service
        run: npm run compose:up -- --wait --no-deps oracledb

      - name: Oracle diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.yml ps oracledb || true
          docker compose -f compose.yml logs --tail=400 oracledb || true

      - run: npm test
        env:
          ORACLE_CLIENT_LIB_DIR: ${{ steps.oracle.outputs.install-path }}

      - name: Free up disk space (after)
        run: ./.github/scripts/free-disk-space.sh

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

